[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hope"
version = "0.1.0"
description = "Hope HN-1: arquitectura neuronal híbrida, modular y estructuralmente plástica (experimental)"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tools = ["sympy>=1.12", "pint>=0.23", "z3-solver>=4.12"]
data = ["pyarrow>=14", "Pillow>=10"]
baseline = ["tokenizers>=0.15"]
web = ["playwright>=1.49"]          # capturas e inspección de solo lectura (hope/tools/web_visual.py)
# Catálogo ampliado (docs/HERRAMIENTAS_HN1.md §8): todas opcionales; sin ellas cada herramienta usa
# un respaldo propio (RK4, rasterizador PNG) o explica qué instalar. Java (JDK) y git son del sistema.
herramientas = ["scipy>=1.11", "matplotlib>=3.8", "capstone>=5.0", "Pillow>=10", "tomli>=2; python_version < '3.11'"]
all = ["sympy>=1.12", "pint>=0.23", "z3-solver>=4.12", "pyarrow>=14", "Pillow>=10", "tokenizers>=0.15",
       "pytest>=8", "scipy>=1.11", "matplotlib>=3.8", "capstone>=5.0", "tomli>=2; python_version < '3.11'"]

[tool.setuptools.packages.find]
include = ["hope*", "guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: pruebas de aprendizaje intrínsecamente largas (excluir con -m \"not slow\")",
]
