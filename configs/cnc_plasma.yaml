# Mesa de plasma para TISMA CNC (hope/cnc, docs/CNC_HOPE.md §8). Unidades: mm, mm/min, mm/s².
# Z0 de trabajo = superficie de la chapa. M3 enciende la antorcha y M5 la apaga.
nombre: plasma de ejemplo
tipo: plasma
ejes:
  X: {pasos_mm: 160, vel_max: 15000, acel: 800, min: 0, max: 1500}
  Y: {pasos_mm: 160, vel_max: 15000, acel: 800, min: 0, max: 3000}
  Z: {pasos_mm: 400, vel_max: 3000, acel: 500, min: -80, max: 0}
desviacion_union: 0.05
tolerancia_arco: 0.01
origenes:
  G54: {X: 10, Y: 10, Z: -60}      # la chapa queda 60 mm por debajo del tope de Z
plasma:
  altura_perforacion: 3.8          # mm sobre la chapa
  altura_corte: 1.5
  retardo_perforacion: 0.5         # s con la antorcha encendida antes de moverse
  altura_traslado: 10
  avance_bajada: 1000              # mm/min de perforación a altura de corte
  perforacion_auto: true           # agrega la secuencia en cada M3 (apagar si el CAM ya la trae, p. ej. SheetCam)
  sensado:                         # sensado inicial de altura (IHS) con cabezal flotante
    activo: true
    avance: 300
    profundidad_max: 20            # mm que baja buscando la chapa (si no toca: alarma)
    holgura_flotante: 1.5          # mm entre el toque y el interruptor
controlador:
  tipo: sim
  # tipo: grbl                     # grblHAL tiene control de altura (THC) propio; se configura en el controlador
  # puerto: COM3
