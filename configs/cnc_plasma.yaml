# Plasma table for TISMA CNC (hope/cnc, docs/CNC_HOPE.md §8). Units: mm, mm/min, mm/s².
# Work Z0 = sheet surface. M3 turns the torch on and M5 turns it off.
nombre: plasma de ejemplo
tipo: plasma
ejes:
  X: {pasos_mm: 160, vel_max: 15000, acel: 800, min: 0, max: 1500}
  Y: {pasos_mm: 160, vel_max: 15000, acel: 800, min: 0, max: 3000}
  Z: {pasos_mm: 400, vel_max: 3000, acel: 500, min: -80, max: 0}
desviacion_union: 0.05
tolerancia_arco: 0.01
origenes:
  G54: {X: 10, Y: 10, Z: -60}      # the sheet is 60 mm below the Z upper limit
plasma:
  altura_perforacion: 3.8          # mm above the sheet
  altura_corte: 1.5
  retardo_perforacion: 0.5         # s with the torch on before moving
  altura_traslado: 10
  avance_bajada: 1000              # mm/min from pierce height down to cut height
  perforacion_auto: true           # adds the sequence at each M3 (turn off if the CAM already emits it, e.g. SheetCam)
  sensado:                         # initial height sensing (IHS) with a floating head
    activo: true
    avance: 300
    profundidad_max: 20            # mm it descends looking for the sheet (no touch: alarm)
    holgura_flotante: 1.5          # mm between the touch and the switch
controlador:
  tipo: sim
  # tipo: grbl                     # grblHAL has its own torch height control (THC); it is configured in the controller
  # puerto: COM3
