# Máquina CNC para Hope CNC (hope/cnc, docs/CNC_HOPE.md). Ejemplo: router de hobby con grblHAL.
# Unidades: mm, mm/min (vel_max) y mm/s² (acel). Límites en coordenadas de máquina (tras referenciar).
# Si venís de Mach3: pasos_mm = «Steps per», vel_max = «Velocity» (mm/min), acel = «Acceleration»
# (Mach3 la muestra en mm/s²) en Config → Motor Tuning.
nombre: router de ejemplo
tipo: router                 # fresadora | router | laser | plasma
ejes:
  X: {pasos_mm: 800, vel_max: 5000, acel: 300, min: 0, max: 600}
  Y: {pasos_mm: 800, vel_max: 5000, acel: 300, min: 0, max: 400}
  Z: {pasos_mm: 800, vel_max: 1500, acel: 150, min: -90, max: 0}
desviacion_union: 0.01       # mm: más alto = esquinas más rápidas y menos exactas
tolerancia_arco: 0.002       # mm
husillo: {rpm_min: 0, rpm_max: 24000}
# Orígenes de trabajo de referencia; antes de enviar se leen los reales del controlador ($#).
origenes:
  G54: {X: 0, Y: 0, Z: 0}
herramientas:
  1: {largo: 0, diametro: 3.175, nombre: fresa plana 1/8"}
  2: {largo: 5.2, diametro: 6, nombre: fresa plana 6 mm}
controlador:
  tipo: sim                  # sim | grbl | linuxcnc
  # grbl / grblHAL / FluidNC:
  # tipo: grbl
  # puerto: /dev/ttyUSB0     # COM3 en Windows, o tcp://192.168.1.50:23 por Ethernet/Wi-Fi
  # baudios: 115200
  # bufer: 128               # 128 en grbl 1.1; 1024 en grblHAL
  # LinuxCNC (puerto paralelo o Mesa):
  # tipo: linuxcnc
