# Plan principal en casa: BASE SIMPLE en la GTX 1060 (6 GB) + i5-9400F + 16 GB (pedido del usuario).
#   python -m hope.train.run --plan configs/plan_gtx1060.yaml
# La 1060 deja una base básica (idioma, código, formato y uso de herramientas) en 1–2 semanas; el entrenamiento largo
# sigue en la A770 con EL MISMO modelo (configs/plan_a770_continuacion.yaml: crece a 500M con visión).
# Se puede cortar y relanzar en cualquier momento: sigue donde quedó.
#
# Por qué 200M y no más grande en la 1060: entrenar necesita pesos + gradientes + optimizador +
# activaciones en alta precisión (~10 bytes por parámetro), no ~0,6 como ejecutar un modelo
# cuantizado. En pocos días, un modelo de 200M ve suficiente texto para una base útil; uno de 1,5B
# vería tan poco que quedaría peor.
#
# Maestro en la misma GPU: el entrenamiento de 200M usa ~3–4 GB, así que un Qwen 1,5B cuantizado
# (~1,2 GB, licencia Apache 2.0) entra a la vez en los 6 GB para la etapa 2 (llama.cpp u Ollama).
salida: runs/hope
precision: fp32-8bit        # Pascal no tiene bf16: pesos fp32 + optimizador en 8 bits
optimizador: muon           # ganó la ablación (docs/resultados/ablacion_cpu.md)
lr: 6.0e-4                  # base corta: tasa algo más alta (WSD la mantiene constante y enfría al final)
warmup: 1000
secuencia: 1024
checkpointing: true
compilar: false             # torch.compile (Triton) no soporta Pascal
checkpoint_min: 30
etapas:
  - nombre: 1_lenguaje      # base simple: español, inglés, código y episodios de corrección
    preset: hn1-200m        # el mismo modelo que después sigue (y crece) en la A770
    config: {multibyte: 3}
    horas: 168              # 1 semana; para 2 semanas, subí a 336 (más horas = mejor base)
    lote: auto
    lote_max: 32
    fuentes:
      wiki_es: data/pre/wiki_es:0.35
      wiki_en: data/pre/wiki_en:0.25
      codigo: data/pre/codigo:0.20
      repos_codigo: data/pre/repos/repos_codigo:0.12
      repos_historial: data/pre/repos/repos_historial:0.08
  - nombre: 2_maestro_local  # episodios verificados de Qwen local (puede correr en la misma GPU)
    # Acá se suman el currículo de uso de herramientas (data/herramientas) y lo aprendido de la web
    # filtrada (data/web) cuando estén construidos; las carpetas que no existan se ignoran.
    horas: 72
    lote: auto
    lote_max: 32
    fuentes:
      wiki_es: data/pre/wiki_es:0.25
      wiki_en: data/pre/wiki_en:0.15
      codigo: data/pre/codigo:0.15
      repos_historial: data/pre/repos/repos_historial:0.10
      maestro: data/maestro:0.25
      herramientas: data/herramientas:0.15
      web: data/web:0.05
