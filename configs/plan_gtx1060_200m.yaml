# Entrenamiento base en casa: GTX 1060 (6 GB) + i5-9400F + 16 GB de RAM (pedido del usuario).
#   python -m hope.train.run --plan configs/plan_gtx1060_200m.yaml
# Alternativa más rápida al plan principal (500M con visión): 200M, solo texto y código.
# Se puede dejar corriendo días o semanas, cortar y relanzar: sigue donde quedó.
# Después, la A770 continúa EL MISMO modelo con configs/plan_a770_continuacion.yaml.
salida: runs/hope
precision: fp32-8bit        # Pascal no tiene bf16: pesos fp32 + Adam en 8 bits (~10 bytes/parámetro)
optimizador: muon           # ganó la ablación (docs/resultados/ablacion_cpu.md)
lr: 3.0e-4
warmup: 2000
secuencia: 1024
checkpointing: true         # menos memoria de activaciones → lotes más grandes en 6 GB
compilar: false             # torch.compile (Triton) no soporta Pascal
checkpoint_min: 30
etapas:
  - nombre: 1_lenguaje      # aprender el idioma y el código: español, inglés, Python/C, repos
    preset: hn1-200m        # el mismo modelo que después sigue en la A770 (no hay que empezar de cero)
    config: {multibyte: 3}
    horas: 1440             # ≈ 2 meses; cortalo antes si querés pasar a la A770
    lote: auto
    lote_max: 32
    fuentes:
      wiki_es: data/pre/wiki_es:0.35
      wiki_en: data/pre/wiki_en:0.25
      codigo: data/pre/codigo:0.20
      repos_codigo: data/pre/repos/repos_codigo:0.12
      repos_historial: data/pre/repos/repos_historial:0.08
  - nombre: 2_maestro_local  # episodios verificados del maestro (Qwen en la CPU con llama.cpp)
    horas: 360              # ≈ 2 semanas
    lote: auto
    lote_max: 32
    fuentes:
      wiki_es: data/pre/wiki_es:0.25
      wiki_en: data/pre/wiki_en:0.15
      codigo: data/pre/codigo:0.15
      repos_historial: data/pre/repos/repos_historial:0.10
      maestro: data/maestro:0.35
