# Continúa en la Intel Arc A770 el modelo entrenado en la GTX 1060.
# 1. Copiar la carpeta runs/hope de la PC de la 1060 a esta máquina.
# 2. python -m hope.train.run --plan configs/plan_a770_continuacion.yaml
# Los pesos fp32 de la 1060 pasan solos a bf16 (más rápido y la mitad de memoria).
salida: runs/hope_a770
desde: runs/hope/2_maestro_local    # último checkpoint de la 1060 (runs/hope/2b_tutoria_opcional si corrió la tutoría)
precision: bf16-8bit
optimizador: muon
lr: 3.0e-4
warmup: 200                 # calentamiento corto: el modelo ya viene entrenado
secuencia: 2048
checkpointing: true
compilar: true
checkpoint_min: 30
guardian: configs/guardian.yaml
etapas:
  - nombre: 3_crecer_500m
    crecer_a: hn1-500m      # si viene de la 1060 con 500M no hace nada; si viene con 200M, crece (pide aprobación)
  - nombre: 3b_tutoria         # tutoría on-policy con un Qwen grande (hope/teacher/tutor.py, §10.1.5)
    horas: 72
    tutoria:                    # SFT antes que RL: primero los intentos corregidos; RL solo en temas que ya aciertan
      maestro: configs/tutor_a770.yaml
      curriculo: configs/curriculum.yaml
      datos: data/tutor         # intentos corregidos con máscara de pérdida, episodios y lecciones
      pasos_consolidacion: 200
      rl: true
      config: {problems_per_topic: 6, topics_per_round: 3, max_tutor_calls: 100000, rl_min_accuracy: 0.3}
  - nombre: 4_vision_procedural
    horas: 720
    rope: {tipo: ntk, escala: 1}   # sin escalar (por si la 1060 hizo la etapa opcional de 8 KB)
    lote: auto
    lote_max: 64
    vision: data/vision
    vision_frac: 0.25
    procedurales: 50000
    fuentes:
      wiki_es: data/pre/wiki_es:0.27
      wiki_en: data/pre/wiki_en:0.17
      codigo: data/pre/codigo:0.18
      codigo_abierto: data/pre/codigo_abierto:0.10   # hope.data.codigo_abierto (licencias permisivas)
      maestro: data/maestro:0.15
      # currículo de herramientas (python -m hope.data.tool_curriculum --out data/herramientas --n 50000)
      herramientas: data/herramientas:0.08
      tutor: data/tutor:0.05     # tutoría (§10.1.5); con train.mask: pérdida solo en lo correcto
  # --- Currículo de contexto largo (§3.9.2; receta ProLong, Gao et al. 2024) ---------------------------
  # Antes de alargar: el modelo pasa a la variante de contexto largo (hope.core.hn1.to_long_context):
  # GQA con 4 cabezas de clave/valor (promedio de las de cada grupo), parte local con ventana de 1 KB
  # (el modelo viene de secuencias de 1–2 KB: la parte local casi no cambia), la primera capa de
  # atención del backbone y el núcleo con ventana de 512 parches y descarte de lo que sale de la
  # ventana; las demás capas de atención siguen completas (recuperación exacta). Reduce parámetros.
  - nombre: 5_convertir_contexto
    convertir_contexto: {kv_heads: 4, local_window: 1024, global_window: 512, sinks: 4}
  # Etapas cada vez más largas (8 → 32 → 128 KB; 2010 h en total, como la etapa 5 anterior). Cada
  # secuencia se lee por segmentos con memoria de Transformer-XL (memoria_segmentos: cache): cada
  # segmento atiende con precisión a todas las claves/valores anteriores (sin gradiente) y hace su
  # backward enseguida, así la memoria de activaciones es la de un segmento aunque el texto tenga
  # 128 KB. RoPE YaRN con escala = largo / 2048 en las capas sin ventana. Mezcla: ≥ 50 % de datos
  # cortos de calidad y el resto, documentos largos de verdad (libros, Wikipedia completa,
  # repositorios enteros concatenados por archivo con su ruta) más tareas sintéticas que solo se
  # resuelven con la memoria (aguja, varias claves, combinar datos lejanos). Datos largos:
  #   python -m hope.data.largos --out data/largos --desde-bin libros=data/web/consolidado/gutenberg \
  #     --desde-bin wiki_es=data/pre/wiki_es --desde-bin wiki_en=data/pre/wiki_en \
  #     --repos-bin repos=data/pre/repos/repos_codigo --min 16K
  #   python -m hope.eval.contexto_bench --datos data/largos/sintetico --bytes 200M
  # Las carpetas que no existan se ignoran (y su peso se reparte entre las demás).
  # El lote no cambia la memoria con segmentos (cada fila se lee sola): se fija en lugar de «auto».
  - nombre: 5a_contexto_8k
    horas: 1000
    lote: 8
    secuencia: 8192
    segmento: 2048
    memoria_segmentos: cache
    rope: {tipo: yarn, escala: 4, bytes_entrenados: 2048}
    vision: data/vision
    vision_frac: 0.25
    fuentes:
      wiki_es: data/pre/wiki_es:0.15          # cortos: 0,56 (≥ 50 %, receta ProLong)
      wiki_en: data/pre/wiki_en:0.10
      codigo: data/pre/codigo:0.08
      codigo_abierto: data/pre/codigo_abierto:0.06
      maestro: data/maestro:0.10
      herramientas: data/herramientas:0.04
      tutor: data/tutor:0.03
      libros: data/largos/libros:0.12         # largos: 0,44
      wiki_largos: data/largos/wiki_es:0.09
      repos_largos: data/largos/repos:0.15
      sintetico: data/largos/sintetico:0.08
  - nombre: 5b_contexto_32k
    horas: 700
    lote: 2
    acumular: 4
    secuencia: 32768
    segmento: 4096
    memoria_segmentos: cache
    rope: {tipo: yarn, escala: 16, bytes_entrenados: 2048}
    vision: data/vision
    vision_frac: 0.15
    fuentes:
      wiki_es: data/pre/wiki_es:0.15          # cortos: 0,56 (≥ 50 %, receta ProLong)
      wiki_en: data/pre/wiki_en:0.10
      codigo: data/pre/codigo:0.08
      codigo_abierto: data/pre/codigo_abierto:0.06
      maestro: data/maestro:0.10
      herramientas: data/herramientas:0.04
      tutor: data/tutor:0.03
      libros: data/largos/libros:0.14         # largos: 0,44
      wiki_largos: data/largos/wiki_es:0.06
      repos_largos: data/largos/repos:0.16
      sintetico: data/largos/sintetico:0.08
  - nombre: 5c_contexto_128k   # 128 KB ≈ 32 mil tokens equivalentes
    horas: 310
    lote: 1
    acumular: 8
    secuencia: 131072
    segmento: 4096
    memoria_segmentos: cache
    rope: {tipo: yarn, escala: 64, bytes_entrenados: 2048}
    vision: data/vision
    vision_frac: 0.1
    fuentes:
      wiki_es: data/pre/wiki_es:0.15          # cortos: 0,56 (≥ 50 %, receta ProLong)
      wiki_en: data/pre/wiki_en:0.10
      codigo: data/pre/codigo:0.08
      codigo_abierto: data/pre/codigo_abierto:0.06
      maestro: data/maestro:0.10
      herramientas: data/herramientas:0.04
      tutor: data/tutor:0.03
      libros: data/largos/libros:0.15         # largos: 0,44
      wiki_largos: data/largos/wiki_es:0.04
      repos_largos: data/largos/repos:0.17
      sintetico: data/largos/sintetico:0.08
  - nombre: 6_enfriamiento   # con los mejores datos; mantiene la escala de RoPE de 128 KB
    horas: 120
    enfriar: true
    qat_bits: [4, 8]        # entrenamiento consciente de la cuantización (Matryoshka 4/8 bits): después
                            # se exporta a 4 u 8 bits con poca pérdida (hope/train/qat.py, hope.core.fast.quantize)
    lote: auto
    fuentes:
      mejores: data/mejores:0.65
      maestro: data/maestro:0.25
      herramientas: data/herramientas:0.10   # el enfriamiento fija el formato de las llamadas
