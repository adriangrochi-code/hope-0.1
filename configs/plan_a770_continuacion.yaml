# Continúa en la Intel Arc A770 el modelo entrenado en la GTX 1060.
# 1. Copiar la carpeta runs/hope de la PC de la 1060 a esta máquina.
# 2. python -m hope.train.run --plan configs/plan_a770_continuacion.yaml
# Los pesos fp32 de la 1060 pasan solos a bf16 (más rápido y la mitad de memoria).
salida: runs/hope_a770
desde: runs/hope/2_maestro_local    # último checkpoint de la 1060 (runs/hope/2b_tutoria_opcional si corrió la tutoría)
precision: bf16-8bit
optimizador: muon
lr: 3.0e-4
warmup: 200                 # calentamiento corto: el modelo ya viene entrenado
secuencia: 2048
checkpointing: true
compilar: true
checkpoint_min: 30
guardian: configs/guardian.yaml
etapas:
  - nombre: 3_crecer_500m
    crecer_a: hn1-500m      # si viene de la 1060 con 500M no hace nada; si viene con 200M, crece (pide aprobación)
  - nombre: 3b_tutoria         # tutoría on-policy con un Qwen grande (hope/teacher/tutor.py, §10.1.5)
    horas: 72
    tutoria:                    # SFT antes que RL: primero los intentos corregidos; RL solo en temas que ya aciertan
      maestro: configs/tutor_a770.yaml
      curriculo: configs/curriculum.yaml
      datos: data/tutor         # intentos corregidos con máscara de pérdida, episodios y lecciones
      pasos_consolidacion: 200
      rl: true
      config: {problems_per_topic: 6, topics_per_round: 3, max_tutor_calls: 100000, rl_min_accuracy: 0.3}
  - nombre: 4_vision_procedural
    horas: 720
    lote: auto
    lote_max: 64
    vision: data/vision
    vision_frac: 0.25
    procedurales: 50000
    fuentes:
      wiki_es: data/pre/wiki_es:0.27
      wiki_en: data/pre/wiki_en:0.17
      codigo: data/pre/codigo:0.18
      codigo_abierto: data/pre/codigo_abierto:0.10   # hope.data.codigo_abierto (licencias permisivas)
      maestro: data/maestro:0.15
      # currículo de herramientas (python -m hope.data.tool_curriculum --out data/herramientas --n 50000)
      herramientas: data/herramientas:0.08
      tutor: data/tutor:0.05     # tutoría (§10.1.5); con train.mask: pérdida solo en lo correcto
  - nombre: 5_multimodal_contexto_largo
    horas: 2010
    lote: auto
    lote_max: 64
    secuencia: 8192
    segmento: 2048
    vision: data/vision
    vision_frac: 0.30
    fuentes:
      wiki_es: data/pre/wiki_es:0.22
      wiki_en: data/pre/wiki_en:0.18
      codigo: data/pre/codigo:0.18
      codigo_abierto: data/pre/codigo_abierto:0.10
      maestro: data/maestro:0.20
      herramientas: data/herramientas:0.07
      tutor: data/tutor:0.05
  - nombre: 6_enfriamiento
    horas: 120
    enfriar: true
    qat_bits: [4, 8]        # entrenamiento consciente de la cuantización (Matryoshka 4/8 bits): después
                            # se exporta a 4 u 8 bits con poca pérdida (hope/train/qat.py, hope.core.fast.quantize)
    lote: auto
    fuentes:
      mejores: data/mejores:0.65
      maestro: data/maestro:0.25
      herramientas: data/herramientas:0.10   # el enfriamiento fija el formato de las llamadas
