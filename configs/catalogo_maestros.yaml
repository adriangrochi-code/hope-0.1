# Catálogo de maestros que la aplicación puede descargar (GGUF Q4_K_M desde Hugging Face) y alternar.
# Pedido del usuario: variedad de datos con varios maestros, solo con licencias que permiten usar sus
# salidas para entrenar otro modelo. La licencia de cada uno se muestra en la app; leela vos también.
#
# Campos: id, nombre, repo y archivo en Hugging Face, gb (tamaño aproximado del archivo), licencia,
# grupo:
#   permitido  → la licencia permite usar sus salidas para entrenar otro modelo
#   confirmar  → licencia propia del fabricante: confirmá el texto antes de activarlo
#   condiciones → licencias con condiciones sobre modelos derivados o destilados: desactivados por defecto
# activo: si se usa por defecto (la app lo descarga en el modo automático).
# Los nombres de repo y archivo se comprueban antes de descargar (si no existen, la app lo dice y no baja nada).
maestros:
  - id: qwen2.5-1.5b
    nombre: Qwen2.5 1.5B Instruct
    repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
    archivo: qwen2.5-1.5b-instruct-q4_k_m.gguf
    gb: 1.1
    licencia: Apache 2.0
    grupo: permitido
    activo: true
  - id: qwen2.5-7b
    nombre: Qwen2.5 7B Instruct
    repo: bartowski/Qwen2.5-7B-Instruct-GGUF
    archivo: Qwen2.5-7B-Instruct-Q4_K_M.gguf
    gb: 4.7
    licencia: Apache 2.0
    grupo: permitido
    activo: false
    nota: el 3B de Qwen2.5 NO es Apache 2.0 (licencia de investigación de Qwen); por eso no está
  - id: qwen3-4b
    nombre: Qwen3 4B
    repo: Qwen/Qwen3-4B-GGUF
    archivo: Qwen3-4B-Q4_K_M.gguf
    gb: 2.5
    licencia: Apache 2.0
    grupo: permitido
    activo: true
  - id: deepseek-r1-distill-qwen-1.5b
    nombre: DeepSeek-R1-Distill-Qwen 1.5B
    repo: bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF
    archivo: DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf
    gb: 1.1
    licencia: MIT
    grupo: permitido
    activo: false
  - id: phi-4-mini
    nombre: Phi-4-mini-instruct
    repo: bartowski/microsoft_Phi-4-mini-instruct-GGUF
    archivo: microsoft_Phi-4-mini-instruct-Q4_K_M.gguf
    gb: 2.5
    licencia: MIT
    grupo: permitido
    activo: true
  - id: mistral-7b-v0.3
    nombre: Mistral 7B Instruct v0.3
    repo: bartowski/Mistral-7B-Instruct-v0.3-GGUF
    archivo: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
    gb: 4.4
    licencia: Apache 2.0
    grupo: permitido
    activo: false
  - id: granite-3.1-2b
    nombre: IBM Granite 3.1 2B Instruct
    repo: bartowski/granite-3.1-2b-instruct-GGUF
    archivo: granite-3.1-2b-instruct-Q4_K_M.gguf
    gb: 1.6
    licencia: Apache 2.0
    grupo: permitido
    activo: false
  - id: granite-3.1-8b
    nombre: IBM Granite 3.1 8B Instruct
    repo: bartowski/granite-3.1-8b-instruct-GGUF
    archivo: granite-3.1-8b-instruct-Q4_K_M.gguf
    gb: 5.0
    licencia: Apache 2.0
    grupo: permitido
    activo: false
  - id: olmo-2-7b
    nombre: OLMo 2 7B Instruct
    repo: bartowski/allenai_OLMo-2-1124-7B-Instruct-GGUF
    archivo: allenai_OLMo-2-1124-7B-Instruct-Q4_K_M.gguf
    gb: 4.5
    licencia: Apache 2.0
    grupo: permitido
    activo: false
  - id: nemotron-nano-4b
    nombre: NVIDIA Nemotron Nano 4B
    repo: bartowski/nvidia_Llama-3.1-Nemotron-Nano-4B-v1.1-GGUF
    archivo: nvidia_Llama-3.1-Nemotron-Nano-4B-v1.1-Q4_K_M.gguf
    gb: 2.6
    licencia: NVIDIA Open Model License
    grupo: confirmar
    activo: false
    nota: licencia propia de NVIDIA (y base Llama 3.1); confirmá el texto antes de usar sus salidas para entrenar

# Licencias con condiciones sobre modelos derivados o destilados: desactivados; activalos solo si aceptás.
  - id: llama-3.2-3b
    nombre: Llama 3.2 3B Instruct
    repo: bartowski/Llama-3.2-3B-Instruct-GGUF
